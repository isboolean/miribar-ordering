server:
  port: 8080

spring:
  application:
    name: miribar-ordering
  datasource:
    url: jdbc:mysql://localhost:3306/miribar_ordering_single?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: Admin
    password: 199811
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    resources:
      static-locations: classpath:/static/,file:../client/dist/

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.miribar.ordering.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.miribar.ordering: info

# 微信小程序配置（顾客端）
# app-secret 属敏感信息：生产环境建议用环境变量或配置中心注入，不要提交到代码库
wx:
  miniapp:
    dev-mode: true                    # 开发者模式：跳过微信登录校验，用本地固定身份联调。上线前改 false 并配置正式 app-id/app-secret
    app-id: your-miniapp-appid        # 替换为小程序 AppID
    app-secret: your-miniapp-secret   # 替换为小程序 AppSecret（建议用环境变量注入，勿提交代码库）
