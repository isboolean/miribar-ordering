server:
  port: 9003

spring:
  application:
    name: miribar-product-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/miribar_product?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:Admin}
    password: ${MYSQL_PASSWORD:199811}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    elasticsearch:
      uris: ${ES_URIS:http://localhost:9200}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.miribar.common.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.miribar.product: info
